<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>

<body>

    <div id="all-section">

        <!-- Heading -->
        <section id="headingsection">
            <h1 id="heading">Expense Tracker</h1>
            <p id="tag-line">Track your spendings, Build better habits.</p>
        </section>


        <!-- Add Expense -->
        <section id="add-expense-section">

            <h2>Add New Expense</h2>

            <div id="add-section">

                <!-- Expense Name -->
                <div id="expense">
                    <label for="expense-name-input">Expense name</label>
                    <input id="expense-name-input" type="text">
                </div>


                <!-- Amount -->
                <div id="amount">
                    <label for="expense-amount-input">Amount</label>
                    <input id="expense-amount-input" type="text">
                </div>


                <!-- Category -->
                <div>
                    <label for="expense-category-input">Category</label>

                    <select id="expense-category-input">
                        <option value="">Select Category</option>
                        <option value="Assets">Assets</option>
                        <option value="Technology">Technology</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Food">Food</option>
                        <option value="Other">Other</option>
                    </select>
                </div>


                <!-- Add Button -->
                <button type="button" id="add-expense-btn">
                    + Add Expense
                </button>

            </div>

        </section>


        <!-- Total Expense -->
        <section id="card-section">

            <!-- Expense Summary Cards -->
<section id="card-section">

    <div class="summary-card" id="cards">
        <h3>Total Expenses</h3>
        <p id="total-expense-value">₹0</p>
    </div>

    <div class="summary-card" id="number-of-expense-card">
        <h3>Number of Expenses</h3>
        <p id="expense-count-value">0</p>
    </div>

    <div class="summary-card" id="highest-expense-card">
        <h3>Highest Expense</h3>
        <p id="highest-expense-value">₹0</p>
    </div>

</section>
        </section>


        <!-- Recent Expenses -->
        <section id="recent-expenses-section">

            <h4 id="recent-expense">Recent Expense</h4>

            <div id="show-expense">
                <!-- Expenses will appear here -->
            </div>

        </section>

    </div>

    <div>
        <button>Save it to the </button>
    </div>


    <!-- JavaScript -->
    <script src="index.js"></script>

</body>

</html>
